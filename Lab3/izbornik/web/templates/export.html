<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Реферат: {{ summary.title }}</title>
  <style>
    body { background: #fff; color: #1f1b16; font: 15px/1.6 "Segoe UI", -apple-system, Roboto, sans-serif; margin: 0; }
    .paper { max-width: 820px; margin: 0 auto; padding: 36px 44px; }
    .paper-kicker { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; color: #8a3b2e; margin: 0; }
    h1 { font-size: 24px; margin: 4px 0 10px; }
    h2 { font-size: 18px; margin: 28px 0 10px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
    .paper-head p { margin: 3px 0; font-size: 13.5px; color: #555; }
    a { color: #8a3b2e; }
    .paper-list li { margin-bottom: 10px; text-align: justify; }
    .paper-meta { color: #888; font-size: 12px; white-space: nowrap; }
    .paper-tree li { margin: 3px 0; }
    .paper-foot { margin-top: 30px; border-top: 1px solid #ddd; padding-top: 8px; }
    .note { color: #777; font-size: 12.5px; }
    @media print { .paper { padding: 0; } a { color: #000; text-decoration: none; } }
  </style>
</head>
<body>
{% include "summary_paper.html" %}
<div class="paper"><p class="note">Построение: {{ engine }}.</p></div>
</body>
</html>
